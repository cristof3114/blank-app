<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16110e">
  <meta name="description" content="Des cocktails au shaker selon les bouteilles de ton bar, avec un pas à pas.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Shaker – Mon bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>🍸 Shaker</h1>
  </header>

  <main>
    <section id="tab-bar" class="tab" hidden>
      <input id="barSearch" type="search" placeholder="Chercher un ingrédient…" autocomplete="off">
      <p id="barSummary" class="summary"></p>
      <div id="barList"></div>
    </section>

    <section id="tab-cocktails" class="tab" hidden>
      <input id="cSearch" type="search" placeholder="Chercher un cocktail ou un ingrédient…" autocomplete="off">
      <div id="filters" class="chips filters"></div>
      <div id="cList"></div>
    </section>

    <section id="tab-ideas" class="tab" hidden>
      <p class="summary">Ce qu'il faut ajouter à ton bar pour débloquer le plus de cocktails.</p>
      <div id="ideasList"></div>
    </section>
  </main>

  <nav class="bottom" aria-label="Navigation">
    <button data-tab="bar"><span>🧴</span>Mon bar</button>
    <button data-tab="cocktails"><span>🍹</span>Cocktails</button>
    <button data-tab="ideas"><span>💡</span>Idées</button>
  </nav>

  <section id="detail" class="overlay" hidden></section>
  <section id="steps" class="overlay" hidden></section>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
